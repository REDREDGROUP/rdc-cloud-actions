name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: ${{ matrix.os }} / ${{ matrix.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        version: [latest, 0.0.4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rdc
        uses: ./
        with:
          version: ${{ matrix.version }}

      - name: Verify installation
        shell: bash
        env:
          EXPECTED: ${{ matrix.version }}
          INSTALLED: ${{ steps.rdc.outputs.version }}
        run: |
          set -euo pipefail
          test "$(rdc --version)" = "$INSTALLED"
          if [ "$EXPECTED" != latest ]; then
            test "$INSTALLED" = "$EXPECTED"
          fi
          rdc --help > /dev/null

  invalid-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: rdc
        uses: ./
        continue-on-error: true
        with:
          version: 'latest; echo injected'

      - name: Expect rejection
        if: steps.rdc.outcome != 'failure'
        run: exit 1
